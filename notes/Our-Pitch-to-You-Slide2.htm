<p><span id="s7l1" class="note-line" data-line="1" data-start="" data-end="" data-start-video="" data-end-video="">You can read, </span><span id="s7l2" class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video="">listen, or </span><span id="s7l3" class="note-line" data-line="3" data-start="" data-end="" data-start-video="" data-end-video="">watch the Bible.</span></p><p><span class="note-line" data-line="3" data-start="" data-end="" data-start-video="" data-end-video="">When experiencing Scripture, sometimes we want to </span><span id="s7l4" class="note-line" data-line="4" data-start="" data-end="" data-start-video="" data-end-video="">see the story, </span><span id="s7l5" class="note-line" data-line="5" data-start="" data-end="" data-start-video="" data-end-video="">emphasize, and </span><span id="s7l6" class="note-line" data-line="6" data-start="" data-end="" data-start-video="" data-end-video="">explore - while keeping Scripture at the center.</span></p><p><span class="note-line" data-line="6" data-start="" data-end="" data-start-video="" data-end-video="">What if all of that came together in one experience?</span></p>
